name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Copiar el juego a www/
        run: npm run build:web

      - name: Crear el proyecto Android (si no existe)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Generar iconos de la app
        run: npx @capacitor/assets@3 generate --android --iconBackgroundColor '#3A1A0E' --iconBackgroundColorDark '#3A1A0E'

      - name: Configurar el manifiesto (horizontal, sin permiso de red)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' $M
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' $M

      - name: Pantalla completa (sin barras y usando la cámara)
        run: |
          mkdir -p android/app/src/main/java/com/aron/proyectoretorno
          cat > android/app/src/main/java/com/aron/proyectoretorno/MainActivity.java << 'EOF'
          package com.aron.proyectoretorno;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (android.os.Build.VERSION.SDK_INT >= 28) {
                getWindow().getAttributes().layoutInDisplayCutoutMode =
                    WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              ocultarBarras();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) ocultarBarras();
            }

            private void ocultarBarras() {
              WindowInsetsControllerCompat c =
                  new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          EOF

      - name: Compilar la APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-retorno-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
