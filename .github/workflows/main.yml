
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Copiar el juego a www/
        run: npm run build:web

      - name: Crear el proyecto Android (si no existe)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sincronizar con Android
        run: npx cap sync android

      - name: Configurar el manifiesto (horizontal, sin permiso de red)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' $M
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' $M

      - name: Compilar la APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: proyecto-retorno-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
